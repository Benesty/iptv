name: lang-audit
on:
  workflow_dispatch:

# Audit de LANGUE — détecte les flux dont la langue contredit le groupe de la
# chaîne (cas réel : un « Disney Channel » annoncé français qui diffusait en
# portugais, mal étiqueté par l'agrégateur).
#
# IMPORTANT : on ne regarde que les pistes TYPE=AUDIO. Les sous-titres étrangers
# sont normaux et ne disent rien de la langue de la chaîne — sans ce filtre,
# TV5Monde+ Voyage (audio FR + sous-titres eng/por/spa) était signalé à tort.
#
# Limite connue : beaucoup de flux « pool » ne déclarent AUCUNE langue. L'audit
# ne peut donc rien dire sur eux ; seule la vérification à l'écran fait foi.
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: audit
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re
          from urllib.parse import urljoin
          import concurrent.futures as cf
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"

          def get(u):
              r=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA,"Accept":"*/*"}),timeout=18)
              return r.read(200000).decode("utf-8","replace"), r.geturl()

          EXPECT={"France":{"fr","fra","fre","qfr","mul","und"},
                  "Canada FR":{"fr","fra","fre","qfr","mul","und"},
                  "Canada EN":{"en","eng","mul","und"},
                  "USA":{"en","eng","mul","und"}}

          def audio_langs(u):
              """langues des pistes AUDIO uniquement (les sous-titres sont ignorés)"""
              try:
                  t,fin=get(u)
              except urllib.error.HTTPError as e:
                  return None, f"HTTP {e.code}"
              except Exception as e:
                  return None, type(e).__name__
              found=set()
              def scan(txt):
                  for m in re.finditer(r'#EXT-X-MEDIA:[^\n]*', txt):
                      line=m.group(0)
                      if "TYPE=AUDIO" not in line.upper():
                          continue                      # <- ignore SUBTITLES
                      lg=re.search(r'LANGUAGE="([^"]+)"', line)
                      if lg: found.add(lg.group(1).lower())
              scan(t)
              if not found and "#EXT-X-STREAM-INF" in t:
                  v=next((urljoin(fin,l.strip()) for l in t.split("\n") if l.strip() and not l.startswith("#")),None)
                  if v:
                      try: scan(get(v)[0])
                      except Exception: pass
              return found, ""

          lines=open("TV.m3u",encoding="utf-8").read().split("\n")
          chans=[]
          for i,l in enumerate(lines):
              if l.startswith("#EXTINF"):
                  g=(re.search(r'group-title="([^"]*)"',l) or [None,"?"])[1]
                  n=l.split(",",1)[-1].strip()
                  u=next((lines[j].strip() for j in range(i+1,min(i+4,len(lines))) if lines[j].strip().startswith("http")),"")
                  if u: chans.append((g,n,u))

          res={}
          with cf.ThreadPoolExecutor(max_workers=16) as ex:
              fut={ex.submit(audio_langs,u):(g,n) for g,n,u in chans}
              for f in cf.as_completed(fut):
                  g,n=fut[f]
                  try: res[(g,n)]=f.result()
                  except Exception as e: res[(g,n)]=(None,type(e).__name__)

          ok=susp=silent=0; suspects=[]
          for g,n,u in chans:
              found,_=res[(g,n)]
              if not found:
                  silent+=1; continue
              if found & EXPECT.get(g,set()):
                  ok+=1
                  print(f"✅ [{g:9}] {n[:32]:32} audio={sorted(found)}")
              else:
                  susp+=1; suspects.append((g,n,sorted(found),u))

          print(f"\n{ok} conformes · {susp} suspects · {silent} sans langue déclarée (indétectable)")
          print(f"\n########## {susp} SUSPECT(S) ##########")
          for g,n,f,u in suspects:
              print(f"  ⚠️  [{g}] {n} -> audio {f}\n      {u[:100]}")
          if not suspects: print("  (aucun)")
          PY
