name: lang-audit
on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: detail TV5Monde+ Voyage
        run: |
          python3 - <<'PY'
          import urllib.request
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          u="https://jmp2.uk/stvp-FR1800004EP"
          r=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA}),timeout=20)
          t=r.read(200000).decode("utf-8","replace")
          print("URL finale :", r.geturl()[:120], "\n")
          # on distingue AUDIO de SUBTITLES : des sous-titres étrangers ne veulent
          # PAS dire que la chaîne est étrangère.
          for l in t.split("\n"):
              if l.startswith("#EXT-X-MEDIA") or l.startswith("#EXT-X-STREAM-INF"):
                  print(l[:190])
          PY
