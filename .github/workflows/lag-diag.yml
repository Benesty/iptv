name: lag-diag
on:
  workflow_dispatch:

# Diagnostic de saccades : un flux lague surtout quand
#   (a) il n'a qu'UNE seule qualité (le lecteur ne peut pas descendre en débit),
#   (b) ses segments sont longs (démarrage et rattrapage lents),
#   (c) le serveur débite moins vite que le flux ne consomme.
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: diagnostic
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, time
          from urllib.parse import urljoin
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"

          def get(u, cap=400000):
              t0=time.time()
              r=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA,"Accept":"*/*"}),timeout=30)
              b=r.read(cap)
              return b, r.geturl(), time.time()-t0

          CH={
            "Slice (celle qui lague)": "http://40.160.24.55/SLICE/index.m3u8",
            "W Network (même serveur)":"http://40.160.24.55/W_NETWORK/index.m3u8",
            "TSN 1 (même serveur)":    "http://40.160.24.55/TSN_1/index.m3u8",
            "Much (autre serveur)":    "http://40.160.24.53/MUCH/index.m3u8",
          }

          for name,u in CH.items():
              print(f"\n########## {name} ##########")
              try:
                  raw,fin,dt=get(u)
                  t=raw.decode("utf-8","replace")
              except Exception as e:
                  print("  injoignable:",type(e).__name__); continue

              variants=re.findall(r'#EXT-X-STREAM-INF:([^\n]*)', t)
              print(f"  qualités proposées : {len(variants)}"
                    + ("   ⚠️ UNE SEULE -> aucune adaptation possible" if len(variants)<=1 else ""))
              for v in variants[:6]:
                  bw=re.search(r'BANDWIDTH=(\d+)',v); rs=re.search(r'RESOLUTION=([\dx]+)',v)
                  print(f"     - {int(bw.group(1))//1000 if bw else '?'} kbps  {rs.group(1) if rs else ''}")

              # descendre au media playlist
              media=t; base=fin
              if variants:
                  v=next((urljoin(fin,l.strip()) for l in t.split("\n") if l.strip() and not l.startswith("#")),None)
                  if v:
                      raw2,base,_=get(v); media=raw2.decode("utf-8","replace")

              td=re.search(r'#EXT-X-TARGETDURATION:(\d+)', media)
              segs=[l.strip() for l in media.split("\n") if l.strip() and not l.startswith("#")]
              durs=[float(x) for x in re.findall(r'#EXTINF:([\d.]+)', media)]
              buf=sum(durs)
              print(f"  segment : {td.group(1) if td else '?'} s   |   {len(segs)} segments en fenêtre"
                    f"   |   tampon dispo ≈ {buf:.0f} s")
              if td and int(td.group(1))>=8:
                  print("     ⚠️ segments longs -> démarrage et reprise lents")
              if buf and buf < 30:
                  print(f"     ⚠️ fenêtre courte ({buf:.0f}s) -> peu de marge, saccade au moindre ralentissement")

              # débit réel du serveur sur un segment
              if segs:
                  s=urljoin(base,segs[0])
                  try:
                      b,_,dt=get(s,cap=3_000_000)
                      kbps=(len(b)*8/1000)/max(dt,0.001)
                      print(f"  débit mesuré : {len(b)/1024:.0f} Ko en {dt:.2f}s = {kbps/1000:.1f} Mbit/s")
                      need=max([int(re.search(r'BANDWIDTH=(\d+)',v).group(1)) for v in variants if re.search(r'BANDWIDTH=(\d+)',v)], default=0)/1000/1000 if variants else 0
                      if need and kbps/1000 < need*1.5:
                          print(f"     ⚠️ le flux demande {need:.1f} Mbit/s : marge insuffisante -> saccades")
                  except Exception as e:
                      print("  débit : échec",type(e).__name__)
          PY
