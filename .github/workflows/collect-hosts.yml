name: collect-hosts
on:
  workflow_dispatch:

# Recense les domaines réellement traversés par les chaînes proxifiées
# (manifeste maître -> variante -> segment -> clé AES) afin de construire une
# allowlist qui ferme le proxy sans casser la lecture.
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: collect
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, collections
          from urllib.parse import urljoin, urlparse, unquote
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"

          def fetch(u, rng=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if rng: h["Range"]=rng
              r=urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=25)
              return r.read(4000 if rng else 400000).decode("utf-8","replace"), r.geturl()

          def uris(text, base):
              """toutes les URI d'un manifeste : segments + URI="..." (clés, map, media)"""
              out=[]
              for ln in text.split("\n"):
                  s=ln.strip()
                  if not s: continue
                  if s.startswith("#"):
                      for m in re.findall(r'URI="([^"]+)"', s):
                          out.append(urljoin(base,m))
                  else:
                      out.append(urljoin(base,s))
              return out

          # domaine « enregistrable » : on garde les 2 derniers labels, 3 pour
          # les suffixes composés (.co.uk, .com.br...)
          def domain(host):
              p=host.lower().split(".")
              if len(p)<=2: return host.lower()
              if p[-2] in ("co","com","net","org","gov","ac") and len(p[-1])==2:
                  return ".".join(p[-3:])
              return ".".join(p[-2:])

          lines=open("TV.m3u",encoding="utf-8").read().split("\n")
          proxied=[]
          for i,l in enumerate(lines):
              if l.startswith("#EXTINF"):
                  name=l.split(",",1)[-1].strip()
                  u=next((lines[j].strip() for j in range(i+1,min(i+4,len(lines))) if lines[j].strip().startswith("http")),"")
                  if u and "/api/fr" in u: proxied.append((name,u))
          print(f"{len(proxied)} chaînes proxifiées\n")

          doms=collections.Counter()
          for name,u in proxied:
              # l'URL réelle visée par le proxy
              q=u.split("?",1)[1] if "?" in u else ""
              tgt=None
              m=re.search(r'(?:^|&)u=([^&]+)', q)
              if m: tgt=unquote(m.group(1))
              else:
                  m=re.search(r'(?:^|&)id=([^&]+)', q)
                  if m:
                      pl,_=fetch("https://raw.githubusercontent.com/Paradise-91/ParaTV/main/playlists/paratv/main/paratv-highest.m3u")
                      L=pl.split("\n"); needle=f'tvg-id="{unquote(m.group(1))}"'
                      for k,ln in enumerate(L[:-1]):
                          if ln.startswith("#EXTINF") and needle in ln and L[k+1].strip().startswith("http"):
                              tgt=L[k+1].strip(); break
              if not tgt: print(f"  ?? {name}"); continue
              found=set()
              try:
                  doms[domain(urlparse(tgt).hostname or "")]+=1; found.add(urlparse(tgt).hostname)
                  t1,base1=fetch(tgt)
                  lvl1=uris(t1,base1)
                  for x in lvl1[:4]:
                      doms[domain(urlparse(x).hostname or "")]+=1; found.add(urlparse(x).hostname)
                  # descendre d'un niveau sur la 1re variante m3u8
                  var=next((x for x in lvl1 if ".m3u8" in x.lower() or ".m3u" in x.lower()), None)
                  if var:
                      t2,base2=fetch(var)
                      for x in uris(t2,base2)[:4]:
                          doms[domain(urlparse(x).hostname or "")]+=1; found.add(urlparse(x).hostname)
              except Exception as e:
                  print(f"  !! {name}: {type(e).__name__}")
              print(f"  ✓ {name:26} {sorted(h for h in found if h)}")

          print("\n===== DOMAINES À AUTORISER =====")
          for d,c in sorted(doms.items(), key=lambda x:-x[1]):
              if d: print(f'  "{d}",   // {c} occurrences')
          PY
