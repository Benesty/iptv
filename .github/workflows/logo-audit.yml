name: logo-audit
on:
  workflow_dispatch:

# Vérifie que CHAQUE tvg-logo renvoie bien une image (et pas un 404 ou une page
# HTML). Nécessite un runner : imgur, picserve.netplus.ch et static-cdn.tv.sfr.net
# ne sont pas joignables depuis l'environnement de dev.
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: audit des logos
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, collections
          import concurrent.futures as cf
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"

          def check(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA,"Accept":"image/*,*/*"}),timeout=20)
                  b=r.read(3000); ct=(r.headers.get("Content-Type") or "").lower()
                  if r.status!=200: return f"HTTP {r.status}"
                  if "image" not in ct:  return f"pas une image ({ct[:24]})"
                  if len(b)<200:         return f"image vide ({len(b)} o)"
                  # imgur renvoie une image « removed » de ~503 o sur les liens morts
                  if "imgur" in u and len(b)<1000: return "imgur : image supprimée ?"
                  return "OK"
              except urllib.error.HTTPError as e: return f"HTTP {e.code}"
              except Exception as e: return type(e).__name__

          rows=[]
          for l in open("TV.m3u",encoding="utf-8"):
              if l.startswith("#EXTINF"):
                  n=l.split(",",1)[-1].strip()
                  m=re.search(r'tvg-logo="([^"]*)"',l)
                  if m: rows.append((n,m.group(1)))

          res={}
          with cf.ThreadPoolExecutor(max_workers=16) as ex:
              fut={ex.submit(check,u):(n,u) for n,u in rows}
              for f in cf.as_completed(fut):
                  n,u=fut[f]
                  try: res[(n,u)]=f.result()
                  except Exception as e: res[(n,u)]=type(e).__name__

          bad=[(n,u,v) for (n,u),v in res.items() if v!="OK"]
          byhost=collections.Counter(u.split("/")[2] for _,u in rows)
          print(f"{len(rows)} logos vérifiés\n")
          print("répartition par hébergeur :")
          for h,c in byhost.most_common(): print(f"   {c:3}  {h}")
          print(f"\n########## {len(bad)} LOGO(S) EN DÉFAUT ##########")
          for n,u,v in sorted(bad):
              print(f"  ❌ {n[:30]:30} {v}")
              print(f"     {u[:105]}")
          if not bad: print("  aucun — tous les logos s'affichent")
          PY
