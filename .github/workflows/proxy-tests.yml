name: Bancs d'essai (proxy + bot)

# Exécute les bancs d'essai HORS-LIGNE à chaque changement du proxy ou du bot :
#   - scripts/test-proxy.mjs : api/fr.js (suivi des redirections, relecture des
#     stubs à jetons « &v=<n> », repli fb=). Le code testé est extrait du fichier
#     déployé, pas une copie.
#   - scripts/test_heal.py   : heal.py contre un faux serveur HLS (flux vivant,
#     gelé, audio seul, VOD, DRM, 404, secours fb=).
# Aucun réseau sortant : ces tests ne dépendent pas de l'état des chaînes.
on:
  push:
    paths:
      - "api/fr.js"
      - "scripts/test-proxy.mjs"
      - "scripts/heal.py"
      - "scripts/test_heal.py"
      - ".github/workflows/proxy-tests.yml"
  workflow_dispatch:

jobs:
  bancs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Proxy (api/fr.js)
        run: node scripts/test-proxy.mjs
      - name: Bot (scripts/heal.py)
        run: python3 scripts/test_heal.py
