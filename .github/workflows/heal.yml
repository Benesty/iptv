name: Auto-heal links

# Teste les flux à URL directe et remplace automatiquement les liens MORTS
# depuis des playlists agrégatrices maintenues. Committe si changement
# (ce qui relance l'EPG et le déploiement Vercel).
#
# - schedule : toutes les 6 h (assez pour rattraper une coupure le jour même,
#   pas assez pour spammer les CDN sources).
# - workflow_dispatch : bouton manuel, avec option "dry_run" pour un rapport
#   sans rien committer.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rapport seulement (aucune modification)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-heal
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Garde-fou : le bot écrit dans TV.m3u sans supervision. Si sa logique de
      # validation est cassée, il vaut mieux ne pas le laisser tourner du tout.
      - name: Banc d'essai du bot (hors-ligne)
        run: python3 scripts/test_heal.py

      - name: Heal
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/heal.py --dry-run
          else
            python3 scripts/heal.py
          fi

      - name: Commit si changement
        if: ${{ inputs.dry_run != true }}
        run: |
          # ETAT.md est le tableau de bord consultable depuis un téléphone :
          # on le publie à chaque passage, même quand TV.m3u n'a pas bougé.
          if git diff --quiet TV.m3u ETAT.md && [ -z "$(git status --porcelain ETAT.md)" ]; then
            echo "Aucun changement."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add TV.m3u ETAT.md
            if git diff --cached --quiet; then
              echo "Aucun changement."
            else
              if git diff --cached --quiet -- TV.m3u; then
                msg="Auto-heal: état des chaînes $(date -u +%F' '%H:%M)"
              else
                msg="Auto-heal: remplacement de liens morts $(date -u +%F)"
              fi
              git commit -m "$msg"
              git push
              echo "Poussé : $msg"
            fi
          fi
