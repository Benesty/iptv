name: epg-sources

# Sonde les fournisseurs de guide EPG et dit lesquels répondent.
#
# Pourquoi : le 2026-09-02, epgshare01.online s'est mis à renvoyer 404 sur son
# index ET sur les trois guides nationaux (FR1/CA1/US1). Le garde-fou de
# build_epg.py a bien fait son travail — refuser de publier un guide incomplet
# et garder le dernier valide — mais il faut retrouver une source qui marche.
#
# Ce workflow ne modifie rien : il teste une liste de candidats et affiche,
# pour chacun, le code HTTP, la taille et le nombre de chaînes/programmes
# réellement présents. On choisit ensuite en connaissance de cause.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/epg-sources.yml'

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sonder les fournisseurs EPG
        run: |
          python3 - <<'PY'
          import gzip, io, urllib.request, urllib.error, re

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")

          CANDIDATS = [
              # --- epgshare01 : l'actuel, dans ses variantes plausibles
              ("epgshare01 index",        "https://epgshare01.online/epgshare01/"),
              ("epgshare01 FR1",          "https://epgshare01.online/epgshare01/epg_ripper_FR1.xml.gz"),
              ("epgshare01 FR1 (racine)", "https://epgshare01.online/epg_ripper_FR1.xml.gz"),
              ("epgshare01 FR1 (http)",   "http://epgshare01.online/epgshare01/epg_ripper_FR1.xml.gz"),
              ("epgshare01 accueil",      "https://epgshare01.online/"),
              # --- iptv-org : guides par pays, maintenus publiquement
              ("iptv-org FR",             "https://iptv-org.github.io/epg/guides/fr.xml"),
              ("iptv-org CA",             "https://iptv-org.github.io/epg/guides/ca.xml"),
              ("iptv-org US",             "https://iptv-org.github.io/epg/guides/us.xml"),
              ("iptv-org FR (gz)",        "https://iptv-org.github.io/epg/guides/fr.xml.gz"),
              # --- open-epg : fournisseur public par pays. Plusieurs fichiers
              # par pays : canada1 ne porte pas les chaînes québécoises, il faut
              # savoir si canada2/3/4 les contiennent.
              ("open-epg France 1",       "https://www.open-epg.com/files/france1.xml"),
              ("open-epg France 2",       "https://www.open-epg.com/files/france2.xml"),
              ("open-epg France 3",       "https://www.open-epg.com/files/france3.xml"),
              ("open-epg France 4",       "https://www.open-epg.com/files/france4.xml"),
              ("open-epg Canada 1",       "https://www.open-epg.com/files/canada1.xml"),
              ("open-epg Canada 2",       "https://www.open-epg.com/files/canada2.xml"),
              ("open-epg Canada 3",       "https://www.open-epg.com/files/canada3.xml"),
              ("open-epg Canada 4",       "https://www.open-epg.com/files/canada4.xml"),
              ("open-epg USA 1",          "https://www.open-epg.com/files/unitedstates1.xml"),
              ("open-epg USA 2",          "https://www.open-epg.com/files/unitedstates2.xml"),
              ("open-epg USA 3",          "https://www.open-epg.com/files/unitedstates3.xml"),
              # --- xmltv.fr : guide TNT française de référence
              ("xmltvfr TNT",             "https://xmltvfr.fr/xmltv/xmltv_tnt.xml"),
              ("xmltvfr TNT (gz)",        "https://xmltvfr.fr/xmltv/xmltv_tnt.xml.gz"),
              # --- déjà utilisés en complément (témoins : doivent répondre)
              ("TÉMOIN Samsung FR",       "https://i.mjh.nz/SamsungTVPlus/fr.xml"),
              ("TÉMOIN Samsung CA",       "https://i.mjh.nz/SamsungTVPlus/ca.xml"),
          ]

          def sonde(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  r = urllib.request.urlopen(req, timeout=45)
              except urllib.error.HTTPError as e:
                  return f"HTTP {e.code}", ""
              except Exception as e:
                  return f"KO {type(e).__name__}", ""
              brut = r.read(6_000_000)
              taille = len(brut)
              texte = ""
              if url.endswith(".gz") or brut[:2] == b"\x1f\x8b":
                  try:
                      texte = gzip.GzipFile(fileobj=io.BytesIO(brut)).read(
                          20_000_000).decode("utf-8", "replace")
                  except Exception as e:
                      return f"OK {taille//1024} Ko", f"gzip illisible ({type(e).__name__})"
              else:
                  texte = brut.decode("utf-8", "replace")
              ch = len(re.findall(r"<channel\b", texte))
              pr = len(re.findall(r"<programme\b", texte))
              # Les chaînes qui manquent aujourd'hui : c'est leur présence qui
              # décide, pas le nombre total de chaînes du fichier.
              CHERCHEES = ["TVA", "LCN", "RDI", "Savoir", "Noovo", "Télé-Québec",
                           "Global", "Knowledge", "National Geographic"]
              trouvees = [c for c in CHERCHEES
                          if re.search(re.escape(c), texte, re.I)]
              if ch or pr:
                  detail = f"{ch} ch., {pr} progr."
                  if trouvees:
                      detail += "  ⟵ " + ", ".join(trouvees[:6])
              elif "<html" in texte[:400].lower():
                  detail = "page HTML, pas du XMLTV"
              else:
                  detail = texte[:60].replace("\n", " ")
              return f"OK {taille//1024} Ko", detail

          print(f"{'SOURCE':26} {'RÉSULTAT':16} DÉTAIL")
          print("=" * 100)
          vivants = []
          for nom, url in CANDIDATS:
              etat, detail = sonde(url)
              print(f"{nom:26} {etat:16} {detail[:60]}")
              print(f"{'':26} {url}")
              if etat.startswith("OK") and ("ch." in detail):
                  vivants.append((nom, url, detail))

          print("\n\n########## UTILISABLES ##########")
          if vivants:
              for nom, url, detail in vivants:
                  print(f"  ✅ {nom:24} {detail}")
                  print(f"     {url}")
          else:
              print("  Aucune source ne renvoie de XMLTV exploitable.")

          # Chaînes de TV.m3u encore sans guide : on cherche leurs identifiants
          # RÉELS dans les sources retenues (id + display-name), pour écrire des
          # alias sûrs dans build_epg.py au lieu de deviner par ressemblance.
          print("\n\n########## IDENTIFIANTS À CHERCHER (chaînes sans guide) ##########")
          MOTS = ["TVA", "CFTM", "RDI", "Noovo", "Global", "CBC Kids", "CBCKids", "Kids",
                  "CKSH", "Estrie", "Sherbrooke", "ICI", "Radio-Canada", "Radio Canada",
                  "Disney", "National Geographic", "Nat Geo", "Knowledge", "CityNews", "City News",
                  "France TV", "France.tv", "Jeunesse", "Agent Jean", "Explore", "CBC", "News", "Comedy", "Gem"]
          for nom, url in CANDIDATS:
              if not (url.startswith("https://www.open-epg.com/files/") or "xmltvfr" in url or "SamsungTVPlus" in url):
                  continue
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA})
                  brut = urllib.request.urlopen(req, timeout=60).read(30_000_000)
              except Exception as e:
                  print(f"\n--- {nom}: injoignable ({type(e).__name__})"); continue
              if url.endswith(".gz") or brut[:2] == b"\x1f\x8b":
                  try: brut = gzip.GzipFile(fileobj=io.BytesIO(brut)).read(60_000_000)
                  except Exception: pass
              texte = brut.decode("utf-8", "replace")
              chans = re.findall(r'<channel id="([^"]+)">\s*<display-name[^>]*>([^<]*)</display-name>', texte)
              hits = [(cid, dn) for cid, dn in chans if any(m.lower() in (cid + " " + dn).lower() for m in MOTS)]
              print(f"\n--- {nom} ({len(chans)} chaînes) : {len(hits)} candidates")
              for cid, dn in hits[:80]:
                  print(f"    {cid:40} {dn}")
          PY
