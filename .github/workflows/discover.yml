name: discover
on:
  workflow_dispatch:

# Sortie COURTE : uniquement les chaînes québécoises jouables + l'inventaire
# francophone des serveurs câblés canadiens 40.160.24.53/.55.
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: chasse
        run: |
          python3 - <<'PY'
          import urllib.request, re, unicodedata
          import concurrent.futures as cf
          from urllib.parse import urljoin, urlparse
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          def fetch(u,rng=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if rng:h["Range"]=rng
              r=urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=15)
              return r.status,r.read(4000 if rng else 300000).decode("utf-8","replace"),r.headers.get("Content-Type",""),r.geturl()
          def first_uri(t,base):
              for ln in t.split("\n"):
                  s=ln.strip()
                  if s and not s.startswith("#"): return urljoin(base,s)
              return None
          def plays(u):
              try:
                  st,t,ct,fin=fetch(u)
                  if not t.lstrip().startswith("#EXT"): return False
                  cur=fin
                  if "#EXT-X-STREAM-INF" in t:
                      v=first_uri(t,cur)
                      if not v: return False
                      st,t,ct,fin=fetch(v); cur=fin
                      if not t.lstrip().startswith("#EXT"): return False
                  seg=first_uri(t,cur)
                  if not seg: return False
                  st,b,ct,_=fetch(seg,rng="bytes=0-2000")
                  return st in (200,206) and len(b)>200 and "html" not in ct.lower()
              except Exception: return False
          def get(u):
              try: return urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA}),timeout=90).read().decode("utf-8","replace")
              except Exception: return ""
          def norm(s):
              s=unicodedata.normalize("NFKD",s or "").encode("ascii","ignore").decode()
              return re.sub(r"[^a-z0-9]+","",s.lower())

          SOURCES=["https://iptv-org.github.io/iptv/index.m3u",
                   "https://iptv-org.github.io/iptv/countries/ca.m3u",
                   "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_canada.m3u8",
                   "https://iptv-org.github.io/iptv/languages/fra.m3u"]
          CA_RX=re.compile(r'\.ca\d*(@|$)', re.I)
          # noms de chaînes québécoises (mots discriminants, pas de « max »/« casa » seuls)
          QC=("telequebec","tele-quebec","tele quebec","noovo","v tele","tva","ici tele","ici radio",
              "ici artv","ici explora","ici rdi","canal vie","canal d ","canal d(","historia",
              "series+","series plus","z tele","ztele","vrak","evasion","zeste","unis tv","matv",
              "meteomedia","rds","artv","explora","prise 2","cine pop","cinepop","super ecran",
              "elle fiction","yoopa","addik","moi et cie","lcn","savoir media","assemblee nationale",
              "radio-canada","tv5 quebec","quebec")
          CABLE=("40.160.24.53","40.160.24.55","206.212.244.63","23.133.220.149")

          cur=open("TV.m3u",encoding="utf-8").read()
          have={norm(l.split(",",1)[-1]) for l in cur.split("\n") if "#EXTINF" in l and "," in l}
          have_urls={l.strip() for l in cur.split("\n") if l.strip().startswith("http")}

          qc={}; cable={}
          for s in SOURCES:
              L=get(s).split("\n")
              for i,l in enumerate(L):
                  if not l.startswith("#EXTINF"): continue
                  name=l.split(",",1)[-1].strip()
                  if not name or any(x in name for x in ("Gecko","Safari","Chrome")): continue
                  tid=(re.search(r'tvg-id="([^"]*)"',l) or [None,""])[1]
                  u=next((L[j].strip() for j in range(i+1,min(i+3,len(L))) if L[j].strip().startswith("http")),"")
                  if not u: continue
                  low=" "+name.lower()+" "
                  h=urlparse(u).hostname or ""
                  # 1) québécoises (pays CA obligatoire)
                  if CA_RX.search(tid or "") and any(k in low for k in QC):
                      if u not in have_urls and norm(name) not in have:
                          qc.setdefault(norm(name),(name,tid,u))
                  # 2) tout ce que portent les serveurs câblés (pour repérage manuel)
                  if h in CABLE:
                      cable.setdefault(f"{h}|{norm(name)}",(h,name,u))
          print(f"{len(qc)} québécoises candidates · {len(cable)} entrées sur les serveurs câblés\n")

          def run(d, key):
              out=[]
              with cf.ThreadPoolExecutor(max_workers=24) as ex:
                  fut={ex.submit(plays,v[-1]):v for v in d.values()}
                  for f in cf.as_completed(fut):
                      v=fut[f]
                      try:
                          if f.result(): out.append(v)
                      except Exception: pass
              return out

          live_qc=run(qc,"qc")
          live_cb=run(cable,"cb")

          print("########## 1. QUÉBÉCOISES JOUABLES ##########")
          for n,t,u in sorted(live_qc,key=lambda x:x[0].lower()):
              print(f"  ✅ {n[:38]:38} | {u[:92]}")
          if not live_qc: print("  (aucune)")

          print("\n########## 2. SERVEURS CÂBLÉS CANADIENS — TOUT CE QUI JOUE ##########")
          for h,n,u in sorted(live_cb,key=lambda x:(x[0],x[1].lower())):
              print(f"  {h:16} {n[:40]:40} {u[:60]}")
          if not live_cb: print("  (rien ne joue)")
          PY
