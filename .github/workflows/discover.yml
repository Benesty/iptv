name: discover
on:
  workflow_dispatch:

# Chasse aux VRAIES chaînes québécoises. Filtre STRICT : le tvg-id doit être
# canadien (.ca) — sinon on ramasse des « TVA » allemandes, « Casa » espagnoles…
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: chasse
        run: |
          python3 - <<'PY'
          import urllib.request, re, unicodedata, collections
          import concurrent.futures as cf
          from urllib.parse import urljoin
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"

          def fetch(u,rng=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if rng:h["Range"]=rng
              r=urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=15)
              return r.status,r.read(4000 if rng else 300000).decode("utf-8","replace"),r.headers.get("Content-Type",""),r.geturl()
          def first_uri(t,base):
              for ln in t.split("\n"):
                  s=ln.strip()
                  if s and not s.startswith("#"): return urljoin(base,s)
              return None
          def plays(u):
              try:
                  st,t,ct,fin=fetch(u)
                  if not t.lstrip().startswith("#EXT"): return False
                  cur=fin
                  if "#EXT-X-STREAM-INF" in t:
                      v=first_uri(t,cur)
                      if not v: return False
                      st,t,ct,fin=fetch(v); cur=fin
                      if not t.lstrip().startswith("#EXT"): return False
                  seg=first_uri(t,cur)
                  if not seg: return False
                  st,b,ct,_=fetch(seg,rng="bytes=0-2000")
                  return st in (200,206) and len(b)>200 and "html" not in ct.lower()
              except Exception: return False
          def get(u):
              try: return urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA}),timeout=90).read().decode("utf-8","replace")
              except Exception: return ""
          def norm(s):
              s=unicodedata.normalize("NFKD",s or "").encode("ascii","ignore").decode()
              return re.sub(r"[^a-z0-9]+","",s.lower())

          SOURCES=[
            "https://iptv-org.github.io/iptv/index.m3u",
            "https://iptv-org.github.io/iptv/countries/ca.m3u",
            "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_canada.m3u8",
            "https://iptv-org.github.io/iptv/languages/fra.m3u",
          ]
          CA_RX = re.compile(r'\.ca\d*(@|$)', re.I)

          cur=open("TV.m3u",encoding="utf-8").read()
          have={norm(l.split(",",1)[-1]) for l in cur.split("\n") if "#EXTINF" in l and "," in l}
          have_urls={l.strip() for l in cur.split("\n") if l.strip().startswith("http")}

          feeds=[(s,get(s)) for s in SOURCES]
          for s,t in feeds: print(f"  {s.split('/')[-1]:26} {t.count('#EXTINF')} chaînes")

          # tout le canadien, puis on marque ce qui est francophone
          FR=("tele","télé","quebec","québec","noovo","tva","canal vie","canal d","historia",
              "serie","série","z tele","ztele","vrak","evasion","évasion","casa","zeste","unis",
              "matv","meteomedia","météo","rds","artv","explora","prise","cinepop","ciné",
              "ecran","écran","elle fiction","yoopa","addik","moi et cie","ici ","radio-canada",
              "francais","français","french","savoir","assemblee","assemblée","lcn","rdi")
          allca={}
          for s,txt in feeds:
              L=txt.split("\n")
              for i,l in enumerate(L):
                  if not l.startswith("#EXTINF"): continue
                  name=l.split(",",1)[-1].strip()
                  if not name or any(x in name for x in ("Gecko","Safari","Chrome")): continue
                  tid=(re.search(r'tvg-id="([^"]*)"',l) or [None,""])[1]
                  if not CA_RX.search(tid or ""): continue        # <-- CANADA obligatoire
                  u=next((L[j].strip() for j in range(i+1,min(i+3,len(L))) if L[j].strip().startswith("http")),"")
                  if not u or u in have_urls or norm(name) in have: continue
                  allca.setdefault(norm(name),(name,tid,u))
          qc={k:v for k,v in allca.items() if any(m in v[0].lower() for m in FR)}
          print(f"\n{len(allca)} chaînes canadiennes absentes, dont {len(qc)} francophones — test…")

          def run(d):
              out=[]
              with cf.ThreadPoolExecutor(max_workers=24) as ex:
                  fut={ex.submit(plays,u):(n,t,u) for n,t,u in d.values()}
                  for f in cf.as_completed(fut):
                      n,t,u=fut[f]
                      try:
                          if f.result(): out.append((n,t,u))
                      except Exception: pass
              return out

          live_qc=run(qc)
          # au cas où le nom ne trahit pas la langue, on teste aussi tout le reste
          # du canadien et on l'affiche à part pour inspection manuelle
          rest={k:v for k,v in allca.items() if k not in qc}
          live_rest=run(rest)

          print(f"\n########## QUÉBÉCOISES QUI JOUENT : {len(live_qc)} ##########")
          for n,t,u in sorted(live_qc,key=lambda x:x[0].lower()):
              print(f"  ✅ {n[:40]:40} | {t[:22]:22} | {u[:86]}")
          if not live_qc: print("  (aucune)")

          print(f"\n########## AUTRES CANADIENNES QUI JOUENT : {len(live_rest)} ##########")
          for n,t,u in sorted(live_rest,key=lambda x:x[0].lower())[:60]:
              print(f"  · {n[:40]:40} | {t[:22]:22} | {u[:70]}")
          PY
