name: discover
on:
  workflow_dispatch:

# Cherche, parmi les agrégateurs, les chaînes NATIONALES françaises et
# QUÉBÉCOISES qui manquent à TV.m3u, et ne retient que celles qui jouent
# vraiment (master -> variante -> segment).
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: discover
        run: |
          python3 - <<'PY'
          import urllib.request, re, unicodedata, collections
          import concurrent.futures as cf
          from urllib.parse import urljoin
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"

          def fetch(u,rng=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if rng:h["Range"]=rng
              r=urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=15)
              return r.status,r.read(4000 if rng else 300000).decode("utf-8","replace"),r.headers.get("Content-Type",""),r.geturl()
          def first_uri(t,base):
              for ln in t.split("\n"):
                  s=ln.strip()
                  if s and not s.startswith("#"): return urljoin(base,s)
              return None
          def plays(u):
              try:
                  st,t,ct,fin=fetch(u)
                  if not t.lstrip().startswith("#EXT"): return False
                  cur=fin
                  if "#EXT-X-STREAM-INF" in t:
                      v=first_uri(t,cur)
                      if not v: return False
                      st,t,ct,fin=fetch(v); cur=fin
                      if not t.lstrip().startswith("#EXT"): return False
                  seg=first_uri(t,cur)
                  if not seg: return False
                  st,b,ct,_=fetch(seg,rng="bytes=0-2000")
                  return st in (200,206) and len(b)>200 and "html" not in ct.lower()
              except Exception: return False
          def get(u):
              try: return urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA}),timeout=60).read().decode("utf-8","replace")
              except Exception: return ""
          def norm(s):
              s=unicodedata.normalize("NFKD",s or "").encode("ascii","ignore").decode()
              return re.sub(r"[^a-z0-9]+","",s.lower())

          SOURCES=[
            "https://iptv-org.github.io/iptv/countries/fr.m3u",
            "https://iptv-org.github.io/iptv/countries/ca.m3u",
            "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_france.m3u8",
            "https://raw.githubusercontent.com/Paradise-91/ParaTV/main/playlists/paratv/main/paratv-highest.m3u",
            "https://raw.githubusercontent.com/schumijo/iptv/main/fr.m3u8",
            "https://iptv-org.github.io/iptv/languages/fra.m3u",
          ]

          # Ce qu'on VEUT (nom normalisé -> doit apparaître au début du nom de la chaîne)
          FRANCE = ["cineplus","cinepremier","cinefrisson","cineclassic","cinefamiz","cineemotion",
            "canalplussport","canalplusseries","canalplusdocs","canalpluskids","canalplusgrandecran",
            "paramountchannel","tcmcinema","ocs","warnertv","comedieplus","polarplus","ushuaia",
            "planeteplus","histoire","scienceetvie","natgeo","nationalgeographic","discovery",
            "animaux","chasseetpeche","seasons","gullimax","canalj","tiji","piwi","boomerang",
            "cartoonnetwork","mangas","gameone","jone","mtv","nrjhits","rfmtv","melody",
            "betfrance","nonstoppeople","ellegirl","trek","automoto","eurosport","beinsports",
            "infosport","golfplus","equidia","machainesport","lcp","publicsenat","euronews",
            "bfmbusiness","bfm2","teletoonplus","disneychannel","nickelodeon","boing","toonami",
            "franceinter","arte","tv5mondechefs","tv5mondestyle"]
          QUEBEC = ["icitele","iciartv","iciexplora","icimusique","tva","noovo","canalvie","canald",
            "historia","seriesplus","ztele","vrak","teletoon","musiqueplus","evasion","casa","zeste",
            "unis","tv5quebec","rds","tvasports","matv","meteomedia","prise2","investigation",
            "cinepop","superecran","ellefictions","yoopa","explora","assembleenationale","telequebec",
            "radiocanada","cbcmontreal"]
          WANT = [(w,"🇫🇷 France") for w in FRANCE] + [(w,"🇨🇦 Québec") for w in QUEBEC]

          BAN=("africa","afrique","cameroun","senegal","congo","maroc","tunis","algerie","gabon",
               "ivoir","haiti","nollywood","arab","brasil","brazuca","latina","espan","portug",
               "italia","deutsch","polska","suisse","swiss","belg","rtbf","rts","luxe","punjab",
               "hindi","tamil","urdu","radio ","stingray","shopping","tsc","test")

          cur=open("TV.m3u",encoding="utf-8").read()
          have={norm(l.split(",",1)[-1]) for l in cur.split("\n") if "#EXTINF" in l and "," in l}
          have_urls={l.strip() for l in cur.split("\n") if l.strip().startswith("http")}

          cands={}
          for s in SOURCES:
              L=get(s).split("\n")
              for i,l in enumerate(L):
                  if not l.startswith("#EXTINF"): continue
                  name=l.split(",",1)[-1].strip()
                  if not name or any(x in name for x in ("Gecko","Safari","Chrome")): continue
                  low=name.lower()
                  if any(b in low for b in BAN): continue
                  n=norm(name)
                  if n in have: continue
                  hit=next((lab for w,lab in WANT if n.startswith(w)), None)
                  if not hit: continue
                  u=next((L[j].strip() for j in range(i+1,min(i+3,len(L))) if L[j].strip().startswith("http")),"")
                  if not u or u in have_urls: continue
                  cands.setdefault(n,(name,hit,u))
          print(f"{len(cands)} candidats ciblés — test en cours…\n")

          live=[]
          with cf.ThreadPoolExecutor(max_workers=24) as ex:
              fut={ex.submit(plays,u):(n,lab,u) for n,lab,u in cands.values()}
              for f in cf.as_completed(fut):
                  n,lab,u=fut[f]
                  try:
                      if f.result(): live.append((lab,n,u))
                  except Exception: pass

          print(f"===== {len(live)} CHAÎNES QUI JOUENT =====")
          for lab in ("🇫🇷 France","🇨🇦 Québec"):
              rows=[(n,u) for l,n,u in live if l==lab]
              print(f"\n--- {lab} ({len(rows)}) ---")
              for n,u in sorted(rows, key=lambda x:x[0].lower()):
                  print(f"  {n[:42]:42} {u}")
          PY
