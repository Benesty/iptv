name: discover
on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: test du reste
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          from urllib.parse import urljoin
          import concurrent.futures as cf
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          CANDS=[
            ("Assemblée nationale QC","https://diffusionm.assnat.qc.ca/diffusion/canal17/playlist.m3u8"),
            ("L'Agent Jean!","https://amagi-streams.akamaized.net/hls/live/2120486/rclagentjean/master.m3u8"),
            ("ICI Télévision Montréal","https://amdici.akamaized.net/hls/live/873426/ICI-Live-Stream/master.m3u8"),
            ("ICI Télé Montréal (dai)","https://rcavlive-dai.akamaized.net/hls/live/696614/cancbftprem/master_5000.m3u8"),
            ("CBC Montréal (tor2)","https://cbcrclinear-tor2.akamaized.net/hls/live/20000034/CBCRCLINEAR_TOR_ETM/master_3000.m3u8"),
            ("ICI Télé Estrie (actuelle)","https://rcavlive.akamaized.net/hls/live/704016/cancksh/master.m3u8"),
          ]
          def get(u,rng=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if rng:h["Range"]=rng
              r=urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=20)
              return r.status,r.read(4000 if rng else 200000).decode("utf-8","replace"),r.headers.get("Content-Type",""),r.geturl()
          def analyse(u):
              try: st,t,ct,fin=get(u)
              except urllib.error.HTTPError as e:
                  return ("🌍 GÉO-CA","403 hors Canada -> OK au Québec") if e.code in (401,403) else ("💀 MORT",f"HTTP {e.code}")
              except Exception as e: return ("💀 MORT",type(e).__name__)
              if not t.lstrip().startswith("#EXT"): return ("💀 MORT","non-HLS")
              low=t.lower()
              if any(k in low for k in ("skd:","sample-aes","widevine","playready")): return ("🔒 DRM","chiffré")
              try:
                  cur=fin; txt=t
                  if "#EXT-X-STREAM-INF" in txt:
                      v=next((urljoin(cur,l.strip()) for l in txt.split("\n") if l.strip() and not l.startswith("#")),None)
                      st,txt,ct,cur=get(v)
                  seg=next((urljoin(cur,l.strip()) for l in txt.split("\n") if l.strip() and not l.startswith("#")),None)
                  st,b,ct,_=get(seg,rng="bytes=0-2000")
                  return ("✅ JOUE","lisible hors Canada") if (st in (200,206) and len(b)>200) else ("💀 MORT",f"segment {st}")
              except urllib.error.HTTPError as e:
                  return ("🌍 GÉO-CA","segments bloqués hors CA -> OK au Québec") if e.code in (401,403) else ("💀 MORT",f"seg {e.code}")
              except Exception as e: return ("💀 MORT",type(e).__name__)
          res={}
          with cf.ThreadPoolExecutor(max_workers=8) as ex:
              fut={ex.submit(analyse,u):n for n,u in CANDS}
              for f in cf.as_completed(fut):
                  try: res[fut[f]]=f.result()
                  except Exception as e: res[fut[f]]=("💀 MORT",type(e).__name__)
          for n,u in CANDS:
              v,d=res[n]
              print(f"{v:12} {n:28} {d}")
          PY
