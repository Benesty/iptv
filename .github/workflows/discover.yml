name: discover
on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: URLs exactes Disney / Nat Geo / History
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re
          import concurrent.futures as cf
          from urllib.parse import urljoin, urlparse
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          def fetch(u,rng=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if rng:h["Range"]=rng
              r=urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=15)
              return r.status,r.read(4000 if rng else 300000).decode("utf-8","replace"),r.headers.get("Content-Type",""),r.geturl()
          def first_uri(t,base):
              for ln in t.split("\n"):
                  s=ln.strip()
                  if s and not s.startswith("#"): return urljoin(base,s)
              return None
          def probe(u):
              try:
                  st,t,ct,fin=fetch(u)
                  if not t.lstrip().startswith("#EXT"): return "pas m3u8",""
                  cur=fin
                  if "#EXT-X-STREAM-INF" in t:
                      v=first_uri(t,cur)
                      if not v: return "pas de variante",""
                      st,t,ct,fin=fetch(v); cur=fin
                  seg=first_uri(t,cur)
                  if not seg: return "pas de segment",""
                  st,b,ct,f2=fetch(seg,rng="bytes=0-2000")
                  ok=st in (200,206) and len(b)>200 and "html" not in ct.lower()
                  return ("JOUE" if ok else f"segment KO({st})"), f2
              except urllib.error.HTTPError as e: return f"HTTP {e.code}",""
              except Exception as e: return type(e).__name__,""
          def get(u):
              try: return urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA}),timeout=90).read().decode("utf-8","replace")
              except Exception: return ""

          SRC=["https://iptv-org.github.io/iptv/index.m3u",
               "https://iptv-org.github.io/iptv/countries/ca.m3u",
               "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_canada.m3u8"]
          CABLE=("40.160.24.53","40.160.24.55","206.212.244.63")
          WANT=re.compile(r'(disney|national geographic|nat geo|history)', re.I)

          rows={}
          for s in SRC:
              L=get(s).split("\n")
              for i,l in enumerate(L):
                  if not l.startswith("#EXTINF"): continue
                  name=l.split(",",1)[-1].strip()
                  if not WANT.search(name): continue
                  u=next((L[j].strip() for j in range(i+1,min(i+3,len(L))) if L[j].strip().startswith("http")),"")
                  if not u: continue
                  if (urlparse(u).hostname or "") in CABLE:
                      rows[(name,u)]=True
          print(f"{len(rows)} entrées Disney/NatGeo/History sur ces serveurs\n")
          res={}
          with cf.ThreadPoolExecutor(max_workers=16) as ex:
              fut={ex.submit(probe,u):(n,u) for n,u in rows}
              for f in cf.as_completed(fut):
                  n,u=fut[f]
                  try: res[(n,u)]=f.result()
                  except Exception as e: res[(n,u)]=(type(e).__name__,"")
          for (n,u),(v,seg) in sorted(res.items(), key=lambda x:x[0][0].lower()):
              flag="✅" if v=="JOUE" else "❌"
              print(f"{flag} {n[:36]:36} {v:14} {u}")
              if seg: print(f"      segment: {seg[:110]}")
          PY
