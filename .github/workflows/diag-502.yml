name: diag-502

# Diagnostic des 502 sur /api/fr (alerte Vercel du 2026-09-12 15:20 UTC).
#
# Pourquoi ce workflow existe : quand une chaîne proxifiée tombe, « 502 » ne dit
# pas OÙ ça casse. Il y a quatre étages, et chacun a sa propre cause :
#
#   1. la playlist ParaTV donne-t-elle encore l'adresse du stub ?   (dossier tournant)
#   2. le stub répond-il, et son jeton est-il encore valide ?       (mainteneur en retard)
#   3. le CDN de l'éditeur accepte-t-il ce jeton depuis une AUTRE   (jeton lié à une IP)
#      adresse que celle qui l'a demandé ?
#   4. le proxy Vercel, lui, répond quoi ?                          (repli fb= ou 502 sec)
#
# L'étage 3 est le seul qu'on ne peut pas observer depuis le proxy : il faut
# une troisième adresse IP (le runner) pour distinguer « jeton périmé » (échoue
# partout) de « jeton verrouillé sur l'IP du demandeur » (échoue chez tout le
# monde SAUF chez celui qui l'a demandé). D'où ce workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diag-502.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Diagnostic des quatre étages
        run: |
          python3 - <<'PY'
          import re, json, base64, time, urllib.request, urllib.error
          from urllib.parse import urlparse, parse_qs, unquote, urljoin

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          PARATV = "https://raw.githubusercontent.com/Paradise-91/ParaTV/main/playlists/paratv/main/paratv-highest.m3u"

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k): return None
          opener = urllib.request.build_opener(NoRedirect)

          def get(url, n=200000, ref=None):
              """-> (status, headers, body). status 0 = pas de réponse HTTP."""
              h = {"User-Agent": UA, "Accept": "*/*"}
              if ref:
                  h["Referer"] = ref
                  h["Origin"] = ref.rstrip("/")
              try:
                  r = opener.open(urllib.request.Request(url, headers=h), timeout=25)
                  return r.status, dict(r.headers), r.read(n).decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read(3000).decode("utf-8", "replace")
              except Exception as e:
                  return 0, {}, f"{type(e).__name__}: {e}"

          def ip_sortie():
              for u in ("https://api.ipify.org", "https://checkip.amazonaws.com"):
                  st, _, b = get(u, 200)
                  if st == 200 and b.strip():
                      return b.strip()
              return "?"

          def jeton(url):
              """Décrit le jeton porté par une URL de CDN : forme, expiration, IP liée."""
              # TF1 : JWT dans le chemin, champ « cip » = IP du client autorisé
              m = re.search(r"/(eyJ[A-Za-z0-9_-]+)\.(eyJ[A-Za-z0-9_-]+)\.", url)
              if m:
                  p = m.group(2) + "=" * (-len(m.group(2)) % 4)
                  try:
                      d = json.loads(base64.urlsafe_b64decode(p))
                      reste = (d.get("exp", 0) - time.time()) / 60
                      return f"JWT cip={d.get('cip','-')} exp dans {reste:.0f} min"
                  except Exception:
                      return "JWT illisible"
              # France TV / Canal+ : segment base64 « exp=…~acl=…~hmac=… »
              m = re.search(r"\.fr/([A-Za-z0-9_~%+-]{24,})/", url)
              if m:
                  s = m.group(1) + "=" * (-len(m.group(1)) % 4)
                  try:
                      t = base64.urlsafe_b64decode(s).decode("utf-8", "replace")
                      e = re.search(r"exp=(\d+)", t)
                      if e:
                          return f"hmac exp dans {(int(e.group(1))-time.time())/60:.0f} min"
                  except Exception:
                      pass
              m = re.search(r"__token__exp=(\d+)", url)
              if m:
                  return f"__token__ exp dans {(int(m.group(1))-time.time())/60:.0f} min"
              return "pas de jeton visible"

          def uris_de(texte, base):
              """Les URI d'un manifeste maître : EXT-X-MEDIA d'abord, puis variantes.

              Le proxy sonde la PREMIÈRE de cette liste — c'est donc elle qu'il
              faut tester pour reproduire sa décision.
              """
              out = []
              for m in re.finditer(r'URI="([^"]+)"', texte):
                  out.append(urljoin(base, m.group(1)))
              for l in texte.split("\n"):
                  l = l.strip()
                  if l and not l.startswith("#"):
                      out.append(urljoin(base, l))
              vus, res = set(), []
              for u in out:
                  if u not in vus:
                      vus.add(u); res.append(u)
              return res

          print(f"IP de sortie du runner : {ip_sortie()}")
          print("(ParaTV demande ses jetons depuis SA propre IP ; le proxy Vercel depuis la sienne.)\n")

          # --- playlist ParaTV : id -> adresse du stub
          st, _, pl = get(PARATV)
          para = {}
          if st == 200:
              lignes = pl.split("\n")
              for i, l in enumerate(lignes):
                  m = re.search(r'tvg-id="([^"]+)"', l)
                  if m and i + 1 < len(lignes) and lignes[i+1].startswith("http"):
                      para.setdefault(m.group(1).strip(), lignes[i+1].strip())
          print(f"Playlist ParaTV : HTTP {st}, {len(para)} chaînes\n")

          # --- chaînes proxifiées de TV.m3u
          chaines, lignes = [], open("TV.m3u", encoding="utf-8").read().split("\n")
          for i, l in enumerate(lignes):
              if not l.startswith("#EXTINF"):
                  continue
              for j in range(i + 1, min(i + 6, len(lignes))):
                  u = lignes[j].strip()
                  if u.startswith("#EXTINF"):
                      break
                  if u.startswith("http"):
                      if "iptv-lake-three.vercel.app" in u:
                          chaines.append((l.split(",", 1)[-1].strip(), u))
                      break

          print(f"{len(chaines)} chaînes passent par le proxy.\n")
          print("=" * 150)
          verdicts = {}

          for nom, purl in chaines:
              q = parse_qs(urlparse(purl).query)
              cid = (q.get("id") or [None])[0]
              cu = (q.get("u") or [None])[0]
              cdm = (q.get("dm") or [None])[0]
              fb = (q.get("fb") or [None])[0]
              mode = "id=" if cid else ("dm=" if cdm else "u=")

              print(f"\n### {nom}   [{mode}{cid or cdm or ''}]   repli fb= : {'OUI' if fb else 'NON'}")

              # étage 4 — ce que le proxy répond (c'est lui qui génère le 502)
              st4, h4, b4 = get(purl, 4000)
              loc = h4.get("Location", "")
              nvar = len(re.findall(r"[?&]v=(\d+)", b4))
              print(f"  4. proxy Vercel          HTTP {st4}"
                    + (f"  -> 302 {loc[:60]}" if loc else "")
                    + (f"  ({nvar} variantes « &v= »)" if nvar else "")
                    + (f"  « {b4.strip()[:90]} »" if st4 >= 400 else ""))

              # étage 1+2 — le stub
              stub = cu if cu else para.get(cid or "")
              if cdm and not stub:
                  stub = unquote(fb) if fb else None
              if not stub:
                  print(f"  1. ParaTV                id « {cid} » ABSENT de la playlist")
                  verdicts.setdefault("id absent de ParaTV", []).append(nom)
                  continue
              est_stub = "raw.githubusercontent.com" in stub
              print(f"  1. adresse du flux       {stub[:110]}")
              st2, _, b2 = get(stub)
              print(f"  2. stub/manifeste        HTTP {st2}  ({len(b2)} o)")
              if st2 != 200:
                  verdicts.setdefault(f"stub HTTP {st2}", []).append(nom)
                  continue

              # étage 3 — le CDN de l'éditeur accepte-t-il le jeton depuis le runner ?
              us = uris_de(b2, stub)
              if not us:
                  print("  3. (pas un manifeste maître — flux direct)")
                  verdicts.setdefault("OK (flux direct)", []).append(nom)
                  continue
              u0 = us[0]
              hote = urlparse(u0).hostname
              print(f"  3. 1re URI ({len(us)} au total)  {hote}   [{jeton(u0)}]")
              st3, _, b3 = get(u0, 3000)
              print(f"     -> depuis le runner   HTTP {st3}" + (f"  « {b3.strip()[:80]} »" if st3 >= 400 else ""))

              if st4 == 200 and st3 == 200:
                  v = "OK partout"
              elif st4 == 200:
                  v = "proxy OK mais 1re URI KO depuis le runner"
              elif loc:
                  v = "proxy bascule sur le repli fb= (pas de 502)"
              elif st3 == 200:
                  v = f"PROXY {st4} alors que la 1re URI joue depuis le runner"
              else:
                  v = f"PROXY {st4} + 1re URI {st3} (le CDN refuse les deux)"
              verdicts.setdefault(v, []).append(nom)

          print("\n" + "=" * 150)
          print("\n########## SYNTHÈSE ##########")
          for v, lst in sorted(verdicts.items(), key=lambda x: -len(x[1])):
              print(f"\n{v} : {len(lst)}")
              for n in lst:
                  print(f"   - {n}")
          PY
