name: test-candidates
on:
  workflow_dispatch:

# Teste les candidats listés dans candidates.json (à la racine).
# Classement :
#   ✅ JOUE    -> lisible même hors Canada
#   🌍 GÉO-CA  -> 403 : géo-réservé au Canada, donc BON pour un usage au Québec
#   🔒 DRM     -> chiffré, inutilisable
#   💀 MORT    -> 404 / injoignable
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, re, collections
          from urllib.parse import urljoin
          import concurrent.futures as cf
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"

          def get(u,rng=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if rng:h["Range"]=rng
              r=urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=20)
              return r.status,r.read(4000 if rng else 250000).decode("utf-8","replace"),r.headers.get("Content-Type",""),r.geturl()

          def classe(u):
              try:
                  st,t,ct,fin=get(u)
              except urllib.error.HTTPError as e:
                  return ("🌍 GÉO-CA","403/401 : réservé au Canada") if e.code in (401,403) else ("💀 MORT",f"HTTP {e.code}")
              except Exception as e:
                  return ("💀 MORT", type(e).__name__)
              low=t.lower()
              if ".mpd" in u.lower() or "contentprotection" in low:
                  return ("🔒 DRM","manifeste DASH/chiffré")
              if not t.lstrip().startswith("#EXT"):
                  return ("💀 MORT","réponse non-HLS")
              if any(k in low for k in ("skd:","sample-aes","widevine","playready")):
                  return ("🔒 DRM","clé DRM référencée")
              try:
                  cur, txt = fin, t
                  if "#EXT-X-STREAM-INF" in txt:
                      v=next((urljoin(cur,l.strip()) for l in txt.split("\n") if l.strip() and not l.startswith("#")),None)
                      if not v: return ("💀 MORT","pas de variante")
                      st,txt,ct,cur=get(v)
                  seg=next((urljoin(cur,l.strip()) for l in txt.split("\n") if l.strip() and not l.startswith("#")),None)
                  if not seg: return ("💀 MORT","pas de segment")
                  st,b,ct,_=get(seg,rng="bytes=0-2000")
                  if st in (200,206) and len(b)>200 and "html" not in ct.lower():
                      return ("✅ JOUE","lisible hors Canada")
                  return ("💀 MORT",f"segment {st}")
              except urllib.error.HTTPError as e:
                  return ("🌍 GÉO-CA","segments réservés au Canada") if e.code in (401,403) else ("💀 MORT",f"segment {e.code}")
              except Exception as e:
                  return ("💀 MORT", type(e).__name__)

          cands=json.load(open("candidates.json",encoding="utf-8"))
          # on ne teste pas ce qui est déjà dans la playlist
          have={l.strip() for l in open("TV.m3u",encoding="utf-8") if l.strip().startswith("http")}
          cands=[c for c in cands if c["url"] not in have]
          print(f"{len(cands)} candidats à tester\n")

          res={}
          with cf.ThreadPoolExecutor(max_workers=20) as ex:
              fut={ex.submit(classe,c["url"]):c for c in cands}
              for f in cf.as_completed(fut):
                  c=fut[f]
                  try: res[c["url"]]=f.result()
                  except Exception as e: res[c["url"]]=("💀 MORT",type(e).__name__)

          par=collections.defaultdict(list)
          for c in cands:
              v,d=res[c["url"]]
              par[v.split()[0]].append((c,v,d))

          for tag,titre in [("✅","UTILISABLES TOUT DE SUITE"),("🌍","GÉO-CANADA — devraient marcher au Québec"),
                            ("🔒","DRM — inutilisables"),("💀","MORTES")]:
              rows=par.get(tag,[])
              print(f"\n########## {titre} : {len(rows)} ##########")
              if tag in ("🔒","💀"):
                  for c,v,d in sorted(rows,key=lambda x:x[0]["name"].lower())[:25]:
                      print(f"  {c['name'][:38]:38} {d}")
                  if len(rows)>25: print(f"  … et {len(rows)-25} autres")
              else:
                  for c,v,d in sorted(rows,key=lambda x:x[0]["name"].lower()):
                      print(f"  {c['name'][:36]:36} [{c.get('langue','?')}] {c['url'][:92]}")
          PY
