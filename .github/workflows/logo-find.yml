name: logo-find
on:
  workflow_dispatch:

# Cherche le logo OFFICIEL de chaque chaîne dans la base iptv-org
# (https://iptv-org.github.io/api/channels.json — inaccessible depuis l'env de
# dev, d'où le runner), pour les chaînes qui n'ont pas de logo ou qui partagent
# celui d'une autre.
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: recherche
        run: |
          python3 - <<'PY'
          import urllib.request, json, re, unicodedata, collections
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA}),timeout=120).read()

          db=json.loads(get("https://iptv-org.github.io/api/channels.json"))
          print(f"base iptv-org : {len(db)} chaînes\n")
          def norm(s):
              s=unicodedata.normalize("NFKD",s or "").encode("ascii","ignore").decode()
              return re.sub(r"[^a-z0-9]","",s.lower())
          byid={c["id"]:c for c in db if c.get("id")}
          byname=collections.defaultdict(list)
          for c in db:
              if c.get("name"): byname[norm(c["name"])].append(c)

          # chaînes de MA playlist : nom, tvg-id, logo actuel
          rows=[]
          for l in open("TV.m3u",encoding="utf-8"):
              if l.startswith("#EXTINF"):
                  n=l.split(",",1)[-1].strip()
                  tid=(re.search(r'tvg-id="([^"]*)"',l) or [None,""])[1]
                  lg=(re.search(r'tvg-logo="([^"]*)"',l) or [None,""])[1]
                  rows.append((n,tid,lg))

          # celles sans logo, ou dont le logo est partagé
          cnt=collections.Counter(lg for _,_,lg in rows if lg)
          cible=[(n,tid,lg) for n,tid,lg in rows if not lg or cnt[lg]>1]
          print(f"{len(cible)} chaînes à traiter (sans logo ou logo partagé)\n")

          for n,tid,lg in cible:
              cand=None
              if tid and tid in byid and byid[tid].get("logo"):
                  cand=byid[tid]["logo"]
              if not cand:
                  for c in byname.get(norm(n),[]):
                      if c.get("logo"): cand=c["logo"]; break
              if not cand:
                  # essai sur le nom sans suffixe pays/qualificatif
                  base=norm(re.sub(r"\b(US|FR|CA|HD)\b","",n))
                  for c in byname.get(base,[]):
                      if c.get("logo"): cand=c["logo"]; break
              etat = "SANS LOGO" if not lg else "partagé"
              print(f"{n[:30]:30} [{etat}]")
              print(f"   actuel  : {lg[:88] or '(aucun)'}")
              print(f"   proposé : {cand[:88] if cand else '(rien trouvé dans la base)'}")
          PY
